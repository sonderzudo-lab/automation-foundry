[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "automation-foundry"
version = "0.1.0"
description = "Plataforma local-first para automações modulares com controle humano"
requires-python = ">=3.12,<3.13"

# ── Dependências de produção ────────────────────────────────────────────────

dependencies = [
    # core: API, fila, banco
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "aiosqlite>=0.20",         # driver async para SQLite (dev/default)
    "asyncpg>=0.30,<1",        # driver async PostgreSQL (runtime concorrente)
    "openai>=1.30",            # cliente HTTP OpenAI-compatível → aponta para Ollama local
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    # utils
    "httpx>=0.27",
    "tenacity>=8.3",           # retry com backoff exponencial
    "structlog>=24.1",         # log estruturado
    "psutil>=7.0,<8",          # saúde local de CPU, memória e disco
    "python-multipart>=0.0.9", # uploads de arquivo no FastAPI
    "jinja2>=3.1",             # templates HTMX
    "aiofiles>=23.2",
    "croniter>=6.2,<7",       # validação e cálculo de schedules cron timezone-aware
    "tzdata>=2026.1",         # base IANA para ZoneInfo no Windows
]

[project.optional-dependencies]

# ── IA / GPU ────────────────────────────────────────────────────────────────
ai = [
    # openai já está em dependencies (core) — cliente do Ollama
    "kokoro==0.9.4",                 # adapter PT-BR somente para quality test local
    "faster-whisper==1.2.1",         # adapter A4 local com timestamps por palavra
    "ctranslate2==4.8.1",            # runtime CUDA fixado do faster-whisper
    "sentence-transformers>=3.0",    # embeddings locais (similaridade D3)
    "diffusers>=0.30,<0.40",         # piso da FluxPipeline; nenhum backend visual aprovado
    "transformers>=4.41",            # backbone dos modelos HuggingFace
    "accelerate>=0.30",              # otimizações de inferência
    "torch>=2.3",                    # PyTorch (CUDA via instalação separada)
    "pydub>=0.25",                   # manipulação de áudio
]

# ── Inteligência de conteúdo / APIs externas ────────────────────────────────
intel = [
    "pytrends>=4.9",                       # Google Trends
    "praw>=7.7",                           # Reddit API
    "google-api-python-client>=2.130",     # YouTube Data API v3
    "google-auth-oauthlib>=1.2",           # OAuth 2.0 YouTube
    "google-auth-httplib2>=0.2",
    "tweepy>=4.14",                        # X / Twitter API
]

# ── Dev / testes ─────────────────────────────────────────────────────────────
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-github-actions-annotate-failures>=0.3",  # falhas viram anotações no GitHub Actions
    "httpx>=0.27",       # AsyncClient para testes FastAPI
    "respx>=0.21",       # mock de chamadas HTTP (Ollama, APIs)
    "ruff>=0.4",         # linter + formatter
    "mypy>=1.10",
]

# ── Hatchling: localização dos pacotes ───────────────────────────────────────
# O código está em src/ (não numa pasta de pacote com o nome do projeto), então precisamos
# dizer ao hatchling explicitamente onde estão os pacotes Python a empacotar.
[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.scripts]
automation-foundry = "src.cli:main"
automation-foundry-worker = "src.worker_cli:main"
automation-foundry-beat = "src.beat_cli:main"
automation-foundry-runtime = "src.runtime_cli:main"

# ── Ruff (linter/formatter) ──────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "gpu: testes que requerem GPU real (pule com -m 'not gpu' em CI)",
    "postgresql: integração que requer TEST_POSTGRESQL_URL para banco descartável",
    "redis: integração que requer TEST_REDIS_URL para broker descartável",
]

# ── Mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
