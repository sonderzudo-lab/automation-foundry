# ─────────────────────────────────────────────────────────────────────────────
# Serviços em container: APENAS Redis (broker + backend do Celery).
#
# O que roda FORA deste compose (no host / venv local):
#   • Python / FastAPI / Celery workers  →  python -m uvicorn / celery worker
#   • Ollama (GPU)                        →  ollama serve
#   • n8n permanece adiado; não faz parte do runtime atual.
# ─────────────────────────────────────────────────────────────────────────────

services:
  redis:
    image: redis:7-alpine
    container_name: automation-foundry-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes   # persistência AOF

volumes:
  redis_data:
    driver: local
